[package]
name = "surveystudio-desktop"
version = "0.4.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }
getrandom = "0.3"
hex = "0.4"
zeroize = "1"
fs2 = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
