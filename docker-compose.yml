services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: surveystudio
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - survey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d surveystudio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  survey_pgdata:
